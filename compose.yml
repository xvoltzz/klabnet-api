services:
  klabnet-api:
    build: .
    container_name: klabnet-api
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
      # Full-quality photo storage on the Vault share. Only image files go
      # here — the SQLite db stays on ./data, since file locking over SMB
      # isn't reliable enough for it.
      - /mnt/Vault/KLAB/KLABNET:/media
    # Secrets live in a .env next to this file, which is gitignored and never
    # baked into the image (the Dockerfile only COPYs app/, so config.py's own
    # .env fallback can't see one from inside the container — it has to come
    # in through the environment). required:false so the stack still starts on
    # a host that hasn't got one yet.
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/prefs.db
      MEDIA_DIR: /media
      # Voice: how this service asks LiveKit (below, on the host's network)
      # who's in a channel. Does nothing until the LIVEKIT_* values are in .env.
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://host.docker.internal:7880}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Voice channels (app/routers/voice.py): the LiveKit server the audio
  # runs through. Off unless .env has COMPOSE_PROFILES=voice, alongside the
  # LIVEKIT_* values (README: Voice).
  # Host networking, not a published port: WebRTC has to hand out the
  # machine's real addresses, and the audio port is forwarded straight here.
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: klabnet-livekit
    restart: unless-stopped
    profiles: ["voice"]
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      # Live streaming (the "live" profile below): LiveKit and Ingress talk
      # through Redis. Empty (the default) means no Redis and no Ingress.
      REDIS_HOST: "${LIVEKIT_REDIS_HOST:-}"

  # Live streaming (app/routers/live.py): OBS streams in here, over WHIP
  # (passed straight through) or RTMP (re-encoded), and it comes out as a
  # LiveKit room people watch. Off unless .env has COMPOSE_PROFILES=voice,live
  # and LIVE_INGRESS=1 (README: Live streaming). Host networking like
  # LiveKit: RTMP 1935 is forwarded from the router, WHIP 8085 sits behind
  # Caddy (live.klab.gg), and both reach LiveKit and Redis on 127.0.0.1.
  ingress:
    image: livekit/ingress:v1.6
    container_name: klabnet-ingress
    restart: unless-stopped
    profiles: ["live"]
    network_mode: host
    depends_on: [redis]
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        rtmp_port: 1935
        whip_port: 8085
        http_relay_port: 9090
        health_port: 8086
        logging:
          level: info
        rtc_config:
          udp_port: 7885
          use_external_ip: true

  # What LiveKit and Ingress pass messages through. Nothing is kept.
  redis:
    image: redis:7-alpine
    container_name: klabnet-redis
    restart: unless-stopped
    profiles: ["live"]
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--save", "", "--appendonly", "no"]
