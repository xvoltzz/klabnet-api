services:
  klabnet-api:
    build: .
    container_name: klabnet-api
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
      # Full-quality photo storage on the Vault share. Only image files go
      # here — the SQLite db stays on ./data, since file locking over SMB
      # isn't reliable enough for it.
      - /mnt/Vault/KLAB/KLABNET:/media
    # Secrets live in a .env next to this file, which is gitignored and never
    # baked into the image (the Dockerfile only COPYs app/, so config.py's own
    # .env fallback can't see one from inside the container — it has to come
    # in through the environment). required:false so the stack still starts on
    # a host that hasn't got one yet.
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/prefs.db
      MEDIA_DIR: /media
      # Voice: how this service asks LiveKit (below, on the host's network)
      # who's in a channel. Does nothing until the LIVEKIT_* values are in .env.
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://host.docker.internal:7880}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Voice channels (app/routers/voice.py): the LiveKit server the audio
  # runs through. Off unless .env has COMPOSE_PROFILES=voice, alongside the
  # LIVEKIT_* values (README: Voice).
  # Host networking, not a published port: WebRTC has to hand out the
  # machine's real addresses, and the audio port is forwarded straight here.
  livekit:
    image: livekit/livekit-server:v1.13
    container_name: klabnet-livekit
    restart: unless-stopped
    profiles: ["voice"]
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
